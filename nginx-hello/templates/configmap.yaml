apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx-hello.fullname" . }}-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>NGINX Hello World</title></head>
    <body>
      <h1>{{ .Values.html.message }}</h1>
      <p>Deployed with Helm on Kubernetes!</p>
    </body>
    </html>
